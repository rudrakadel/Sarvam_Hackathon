version: "3.9"
services:
  backend:
    build: ./backend
    ports:
      - "8001:8001"
    env_file: ./backend/.env
    volumes:
      - ./backend:/app
    depends_on:
      - redis
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload

  celery_worker:
    build: ./backend
    env_file: ./backend/.env
    depends_on:
      - backend
      - redis
    command: celery -A app.tasks.celery_app worker --loglevel=info -Q transcription,ocr,analysis,reports -c 4

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://backend:8001
      - VITE_WS_URL=ws://backend:8001
