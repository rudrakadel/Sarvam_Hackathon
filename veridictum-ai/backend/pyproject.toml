[tool.ruff]
# Match the Python version Pydantic / SQLAlchemy 2.0 / FastAPI are tested on.
target-version = "py312"
line-length = 100

# Don't lint third-party caches or generated assets.
extend-exclude = [
    ".venv",
    "venv",
    "__pycache__",
    "alembic/versions",          # keep alembic templates verbatim
    "tmp_storage",
    "tmp_evidence",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ASYNC",  # flake8-async (essential for our async DB layer)
    "S",      # bandit-lite security checks
    "RUF",    # ruff-specific rules
]
ignore = [
    "E501",  # line length is handled by formatter
    "S101",  # assert statements are fine in tests
    "S105", "S106",  # hardcoded password warnings — too many false positives on test fixtures
    "B008",  # function calls in argument defaults (FastAPI Depends is the whole API)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]   # tests get to be permissive
"seed_*.py" = ["S"]      # seed scripts have demo credentials in plain text by design

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
